# Local development database. Production uses a managed Postgres in a UK region (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fettle
    ports:
      - "5432:5432"
    volumes:
      - fettle-data:/var/lib/postgresql/data
      - ./db/dev-init.sql:/docker-entrypoint-initdb.d/10-dev-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fettle"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  fettle-data:
