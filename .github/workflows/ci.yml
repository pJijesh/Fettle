name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # The tests create their own throwaway databases from this superuser connection.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LINK_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Known-vulnerable runtime dependencies fail the build. Dev-only packages are not shipped, so they are left out.
      - run: npm audit --omit=dev --audit-level=high
